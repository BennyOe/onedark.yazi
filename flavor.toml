# : Manager {{{
[mgr]
cwd = { fg = "#61AFEF" }  # Blue

# Find
find_keyword = { fg = "#E06C75", italic = true, underline = true }  # Red
find_position = { fg = "#E5C07B", italic = true }  # Orange

# Marker
marker_copied = { fg = "#ABB2BF", bg = "#98C379" }  # Light gray on Green
marker_cut = { fg = "#ABB2BF", bg = "#E06C75" }  # Light gray on Red
marker_marked = { fg = "#ABB2BF", bg = "#56B6C2" }  # Light gray on cyan
marker_selected = { fg = "#ABB2BF", bg = "#E5C07B" }  # Light gray on Orange

# Count
count_copied = { fg = "#98C379", bg = "#282C34" }  # Green on Darkened background
count_cut = { fg = "#E06C75", bg = "#282C34" }  # Red on Darkened background
count_selected = { fg = "#98C379", bg = "#282C34" }  # Green on Darkened background

# Border
border_symbol = "│"
border_style = { fg = "#282C34" }  # Darkened background

# Highlighting
syntect_theme = "tmtheme.xml"

# : }}}

# : Tabs {{{
[tabs]
active = { bg = "#282C34", fg = "#61AFEF" }  # Darkened background, Blue text
inactive = {}

# : }}}

# : Mode {{{
[mode]
normal_main = { fg = "#282C34", bg = "#61AFEF", bold = true }  # Dark gray on Blue
normal_alt = { fg = "#61AFEF", bg = "#282C34" }  # Blue on Darkened background

# Select mode
select_main = { fg = "#282C34", bg = "#61AFEF", bold = true }  # Dark gray on Blue
select_alt = { fg = "#61AFEF", bg = "#282C34" }  # Blue on Darkened background

# Unset mode
unset_main = { fg = "#282C34", bg = "#61AFEF", bold = true }  # Dark gray on Blue
unset_alt = { fg = "#61AFEF", bg = "#282C34" }  # Blue on Darkened background

# : }}}

# : Indicator of hovered file {{{
[indicator]
parent = { bg = "#282C34" }  # Darkened background
current = { bg = "#282C34" }  # Darkened background
preview = { underline = true }

# : }}}

# : Status {{{
[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label = { fg = "#ABB2BF", bold = true }  # Light gray
progress_normal = { fg = "#98C379", bg = "#282C34" }  # Green on Darkened background
progress_error = { fg = "#E06C75", bg = "#282C34" }  # Red on Darkened background

# Permissions
perm_type = { fg = "#98C379" }  # Green
perm_read = { fg = "#E06C75" }  # Red
perm_write = { fg = "#E5C07B" }  # Orange
perm_exec = { fg = "#98C379" }  # Green
perm_sep = { fg = "#ABB2BF" }  # Light gray

# : }}}

# : Pick {{{
[pick]
border = { fg = "#98C379" }  # Green
active = { fg = "#E5C07B", bold = true }  # Orange
inactive = {}

# : }}}

# : Input {{{
[input]
border = { fg = "#98C379" }  # Green
title = {}
value = {}
selected = { reversed = true }

# : }}}

# : Completion {{{
[cmp]
border = { fg = "#98C379" }  # Green

# : }}}

# : Tasks {{{
[tasks]
border = { fg = "#98C379" }  # Green
title = {}
hovered = { fg = "#E5C07B", underline = true }  # Orange

# : }}}

# : Which {{{
[which]
mask = { bg = "#282C34" }  # Darkened background
cand = { fg = "#98C379" }  # Green
rest = { fg = "#ABB2BF" }  # Light gray
desc = { fg = "#E5C07B" }  # Orange
separator = "  "
separator_style = { fg = "#ABB2BF" }  # Light gray

# : }}}

# : Help {{{
[help]
chord = { fg = "#98C379" }  # Green
action = { fg = "#E5C07B" }  # Orange
hovered = { reversed = true, bold = true }

# : }}}

# : Notify {{{
[notify]
title_info = { fg = "#98C379" }  # Green
title_warn = { fg = "#E06C75" }  # Red
title_error = { fg = "#E5C07B" }  # Orange

# : }}}

# : File-specific styles {{{

[filetype]

rules = [
    # Images
    { mime = "**/image/*", fg = "#E5C07B" },  # Orange

    # Media
    { mime = "**/{audio,video}/*", fg = "#E06C75" },  # Red

    # Archives
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#C678DD" },  # Magenta

    # Documents
    { mime = "**/application/{pdf,doc,rtf}", fg = "#98C379" },  # Green
    { mime = "**/application/vnd.*", fg = "#98C379" },  # Green

    # Fallback
    { url = "*", fg = "#ABB2BF" },  # Light gray
    { url = "*/", fg = "#61AFEF" }  # Blue
]

# : }}}
